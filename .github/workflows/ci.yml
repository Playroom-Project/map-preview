name: Map PreView CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: map-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base:
    name: Shared base / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify, test and assemble shared libraries
        run: ./gradlew --no-daemon --stacktrace check assemble
      - name: Verify architecture and runtime naming
        run: python3 scripts/check_architecture.py
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-preview-tests-java-${{ matrix.java }}
          path: |
            **/build/test-results/test/*.xml
            **/build/reports/tests/test/
          retention-days: 14
      - name: Preserve foundation libraries
        if: matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: map-preview-foundation-libraries
          path: '**/build/libs/*.jar'
          if-no-files-found: error
          retention-days: 14
