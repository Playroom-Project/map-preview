name: Map PreView synthetic benchmark

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Recorded iterations after two warmup runs
        required: true
        default: '5'
        type: choice
        options: ['5', '10', '20']

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Measure the synthetic engine fixture
        env:
          ITERATIONS: ${{ inputs.iterations }}
        run: ./gradlew --no-daemon :benchmarks:run --args="--iterations=${ITERATIONS} --output=results/synthetic.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: map-preview-synthetic-results
          path: benchmarks/results/synthetic.csv
          if-no-files-found: error
          retention-days: 30
